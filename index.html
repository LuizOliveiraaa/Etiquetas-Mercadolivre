<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Etiquetas</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<link rel="icon" type="image/png" href="https://luizoliveiraaa.github.io/Etiquetas-Mercadolivre/favicon.png">

<style>
@page {
    size: A4;
    margin: 0;
}

body { 
    margin:0; 
    font-family: Arial; 
    background: white;
}

.page {
    width: 210mm;
    height: 297mm;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    padding: 10mm;
    box-sizing: border-box;
    page-break-after: always;
}

.etiqueta {
    border: 4px solid black;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
}

/* TOPO */
.topo {
    background: #ffe600;
    text-align: center;
    padding: 15px;
}

.topo img { 
    height: 90px;
}

/* TITULO */
.titulo {
    background: #eee;
    text-align: center;
    font-weight: bold;
    font-size: 28px;
    padding: 12px;
    border-top: 2px solid black;
    border-bottom: 2px solid black;
}

/* TEXTO PRINCIPAL */
.nome {
    text-align: center;
    font-size: 34px;
    padding: 18px;
    font-weight: bold;
    word-break: break-word;
    line-height: 1.2;
}

/* QR */
.qr {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-grow: 1;
    padding: 20px;
}

/* FOOTER */
.footer {
    background: #003a8f;
    text-align: center;
    padding: 15px;
    color: white;
    font-size: 18px;
}

.footer img { 
    height: 55px; 
    display: block;
    margin: 0 auto 8px;
}

/* SEM DADOS */
.sem-dados {
    text-align: center;
    margin-top: 100px;
    font-size: 24px;
}
</style>
</head>

<body>

<div id="paginas"></div>

<script>

// 🔥 SEMID
function formatarSemid(numero) {

    numero = String(numero)
        .replace("SEMID-", "")
        .trim();

    if (numero.length < 5) {
        numero = numero.padStart(5, '0');
    }

    return `semid_sal1_${numero}`;
}

// 🔥 GAYLORD
function formatarGaylord(numero, comId) {

    return `G1_SAL1 ${numero} ${comId ? "Com ID" : "Sem ID"}`;
}

// 🔥 ZPL
function modoZPL(lista) {

    const url = new URL(window.location.href);

    const zpl = url.searchParams.get("zpl");

    if (!zpl) return false;

    let resultado = "";

    lista.forEach(item => {

        let codigo;

        // 🔥 SEMID
        if (item.startsWith("SEMID")) {

            let numero = item.replace("SEMID-", "");

            codigo = formatarSemid(numero);

        } 
        
        // 🔥 GAYLORD
        else {

            let [numero, tipo] = item.split("-");

            let comId = tipo === "com";

            codigo = formatarGaylord(numero, comId);
        }

        resultado += `
^XA
^PW800
^LL600

^CF0,40

^FO50,30^FDSALVADOS - SAL1^FS

^FO50,90^A0N,45,45^FD${codigo}^FS

^FO50,170^BY4
^BCN,180,Y,N,N
^FD${codigo}^FS

^FO540,360^BQN,2,7
^FDLA,${codigo}^FS

^XZ
`;
    });

    document.body.innerHTML = `
        <h2 style="font-family: Arial">
            Modo Zebra 🏷️
        </h2>

        <textarea style="
            width:100%;
            height:500px;
            font-size:16px;
            font-family:monospace;
        ">${resultado}</textarea>
    `;

    return true;
}

// 🔥 PARAMETROS
function getParametros() {

    const url = new URL(window.location.href);

    const dados = url.searchParams.get("dados");

    const inicio = url.searchParams.get("inicio");

    const fim = url.searchParams.get("fim");

    let lista = [];

    // 🔥 GAYLORD
    if (dados) {

        lista = dados.split(",");

    } 
    
    // 🔥 SEMID
    else if (inicio && fim) {

        for (let i = parseInt(inicio); i <= parseInt(fim); i++) {

            lista.push("SEMID-" + i);
        }
    }

    return lista;
}

// 🔥 GERAR
function gerar() {

    let lista = getParametros();

    let container = document.getElementById("paginas");

    // 🔥 MODO ZPL
    if (modoZPL(lista)) return;

    // 🔥 SEM DADOS
    if (!lista.length) {

        container.innerHTML = `
            <div class="sem-dados">
                <h2>Nenhum dado recebido</h2>
            </div>
        `;

        return;
    }

    // 🔥 UMA ETIQUETA POR FOLHA
    lista.forEach((item, index) => {

        let page = document.createElement("div");

        page.className = "page";

        container.appendChild(page);

        let texto;
        let titulo;

        // 🔥 SEMID
        if (item.startsWith("SEMID")) {

            let numero = item.replace("SEMID-", "");

            texto = formatarSemid(numero);

            titulo = "SEM ID";

        } 
        
        // 🔥 GAYLORD
        else {

            let [numero, tipo] = item.split("-");

            let comId = tipo === "com";

            texto = formatarGaylord(numero, comId);

            titulo = `PACOTES ${comId ? "COM ID" : "SEM ID"}`;
        }

        let etiqueta = document.createElement("div");

        etiqueta.className = "etiqueta";

        etiqueta.innerHTML = `
            <div class="topo">
                <img src="https://luizoliveiraaa.github.io/Etiquetas-Mercadolivre/logomeli.png">
            </div>

            <div class="titulo">
                ${titulo}
            </div>

            <div class="nome">
                ${texto}
            </div>

            <div class="qr" id="qr${index}"></div>

            <div class="footer">
                <img src="https://luizoliveiraaa.github.io/Etiquetas-Mercadolivre/logokn.png">

                Equipe Inventario - Kuehne Nagel SAL1<br>
                Cada Pacote Importa!
            </div>
        `;

        page.appendChild(etiqueta);

        //  QR GIGANTE
        new QRCode(document.getElementById(`qr${index}`), {

            text: texto,

            width: 350,
            height: 350
        });
    });

    //  IMPRIMIR
    setTimeout(() => window.print(), 500);
}

gerar();

</script>

</body>
</html>
